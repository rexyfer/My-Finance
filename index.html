<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Finance">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>My Finance</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--in:#1f9d55;--out:#e0443a;--acc:#0a6e6e}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--sub:#98989f;--line:#2c2c2e;--in:#35c46f;--out:#ff6961;--acc:#4fd1c5}.hero{color:#04201f!important}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px}
h1{font-size:28px;letter-spacing:-.5px;margin:6px 0 12px}h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:var(--acc);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.sub{color:var(--sub);font-size:13px}.in{color:var(--in)}.out{color:var(--out)}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:8px;border-radius:8px;font:600 14px system-ui}.seg button.on{background:var(--card)}
input,select{width:100%;font:16px system-ui;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:10px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:600 16px system-ui;background:var(--acc);color:#fff;margin-bottom:8px}
.btn.g{background:var(--line);color:var(--tx)}.btn:disabled{opacity:.5}
a.btn{display:block;text-align:center;text-decoration:none}
.del{border:0;background:none;color:var(--out);font-size:13px}
.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:9}.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.msg{color:var(--out);font-size:14px;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
</style></head>
<body><div class="wrap" id="app"></div><div class="sheet" id="sheet"><div id="sf"></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
import {SUPABASE_URL,SUPABASE_KEY} from './config.js';
const OK=SUPABASE_URL.startsWith('https://'),sb=OK?createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID');
const num=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const SP={personal:'Personal',business:'Business'};
const KL={in:'Pemasukan',out:'Pengeluaran',transfer_in:'Transfer masuk',transfer_out:'Transfer keluar',debt_in:'Penerimaan piutang',debt_out:'Pembayaran utang'};
const PLUS=['in','transfer_in','debt_in'];
let S={space:'personal',user:null,acc:[],accAll:[],mid:null,cat:[],tx:[],debts:[],pays:[],hub:'',ha:'btc',hold:[],holdErr:'',pxE:{btc:'',gold:''},px:{btc:{p:0,t:0,src:''},gold:{p:0,t:0,src:''}},msg:'',off:0,real:false,busy:false,req:null,pid:null,eid:null};
const openS=h=>{S.hub='';S.dk='';$('sf').innerHTML=h;$('sheet').classList.add('show')},closeS=()=>{S.hub='';S.dk='';$('sheet').classList.remove('show')},fm=m=>{if($('fm'))$('fm').textContent=m},amsg=m=>{if($('msg'))$('msg').textContent=m};
try{const x=JSON.parse(localStorage.getItem('mf_px'));if(x){for(const k of ['btc','gold'])if(x[k]&&x[k].p>0)S.px[k]=x[k]}else{const y=JSON.parse(localStorage.getItem('mf_btc'));if(y&&y.p>0)S.px.btc=y}}catch(e){}
const CK='mf_cache_v1';
const saveCache=()=>{try{localStorage.setItem(CK,JSON.stringify({uid:S.user.id,t:Date.now(),accAll:S.accAll,cat:S.cat,tx:S.tx,debts:S.debts,pays:S.pays,hold:S.hold}))}catch(e){}};
const readCache=()=>{try{const c=JSON.parse(localStorage.getItem(CK));return c&&c.uid?c:null}catch(e){return null}};
const useCache=c=>{S.accAll=c.accAll||[];S.acc=S.accAll.filter(x=>x.is_active);S.cat=c.cat||[];S.tx=c.tx||[];S.debts=c.debts||[];S.pays=c.pays||[];S.hold=c.hold||[];S.off=c.t};
const opts=(arr,f)=>arr.map(f).join('');
const paidOf=d=>S.pays.filter(p=>p.debt_id===d.id).reduce((s,p)=>s+p.amount,0);
async function pageAll(t){let o=[],f=0;for(;;){const r=await sb.from(t).select('*').order('id').range(f,f+999);if(r.error)throw r.error;o=o.concat(r.data);if(r.data.length<1000)return o;f+=1000}}

async function load(){
 const [a,c,t,d,p,h]=await Promise.all([
  sb.from('account_balances').select('*').order('name'),
  sb.from('categories').select('*').eq('is_active',true).order('name'),
  sb.from('transactions').select('*').order('occurred_at',{ascending:false}).limit(1000),
  sb.from('debts').select('*').order('created_at',{ascending:false}),
  sb.from('debt_payments').select('*').order('paid_at',{ascending:false}),
  sb.from('holdings_entries').select('*').order('occurred_at',{ascending:false})]);
 const e=a.error||c.error||t.error||d.error||p.error,net=e&&(!navigator.onLine||/fetch|network|load failed/i.test(e.message||''));
 if(net){const ch=readCache();if(ch&&ch.uid===S.user.id){useCache(ch);S.msg='';return render()}}
 S.off=0;S.msg=e?'Gagal memuat data: '+e.message:'';
 S.accAll=a.data||[];S.acc=S.accAll.filter(x=>x.is_active);S.cat=c.data||[];S.tx=t.data||[];S.debts=d.data||[];S.pays=p.data||[];S.hold=h.error?[]:(h.data||[]);S.holdErr=h.error?h.error.message:'';if(!e&&S.real)saveCache();render();if(Date.now()-Math.min(S.px.btc.t,S.px.gold.t)>30000)fetchPx()}

const AS={btc:{n:'Bitcoin',u:'BTC',sc:1e8,dp:8},gold:{n:'Emas Antam',u:'gram',sc:1e4,dp:4}};
const toSc=(q,a)=>Math.round(Number(q)*AS[a].sc),mulp=(s,p,a)=>Number((BigInt(s)*BigInt(Math.round(p))+BigInt(AS[a].sc/2))/BigInt(AS[a].sc));
const fmtQ=(s,a)=>(s/AS[a].sc).toLocaleString('id-ID',{maximumFractionDigits:AS[a].dp});
function pos(H,a){let s=0,c=0,r=0;H.filter(x=>x.asset===a).sort((x,y)=>new Date(x.occurred_at)-new Date(y.occurred_at)||new Date(x.created_at)-new Date(y.created_at)).forEach(x=>{const q=toSc(x.quantity,a),v=mulp(q,x.price_idr,a),f=Number(x.fee_idr)||0;
 if(x.side==='buy'){c+=v+f;s+=q}else{const part=s>0?Math.round(c*Math.min(q,s)/s):0;r+=v-f-part;c-=part;s=Math.max(0,s-q)}});return{s,c,r}}
function box(a){const H=S.hold.filter(x=>x.space==='personal'),P=pos(H,a),X=S.px[a],pr=X.p,val=pr?mulp(P.s,pr,a):0,un=val-P.c,sg=n=>(n>0?'+':'')+rp(n),old=pr&&Date.now()-X.t>9e5,u=AS[a].u;
 return `<div class="row"><b>Kepemilikan</b><b>${fmtQ(P.s,a)} ${u}</b></div>
<div class="row"><div><span>Harga 1 ${u}</span><div class="sub">${pr?'Diperbarui '+new Date(X.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' · '+esc(X.src)+(old?' · data lama':''):'Belum dimuat'}${S.pxE[a]?' · '+esc(S.pxE[a]):''}</div></div><b>${pr?rp(pr):'-'}</b></div>
<div class="row"><span>Nilai sekarang</span><b>${pr?rp(val):'-'}</b></div>
<div class="row"><span>Modal tersisa</span><b>${rp(P.c)}</b></div>
<div class="row"><span>Untung/rugi (belum dijual)</span><b class="${un>=0?'in':'out'}">${pr?sg(un):'-'}</b></div>
<div class="row"><span>Untung/rugi (sudah dijual)</span><b class="${P.r>=0?'in':'out'}">${sg(P.r)}</b></div>
${a==='gold'?'<div class="sub" style="margin:6px 0">Harga emas adalah perkiraan dari harga emas dunia, bukan harga Antam. Harga jual/buyback Antam di toko bisa berbeda beberapa persen.</div>':''}
<div style="display:flex;gap:8px;margin-top:6px"><button class="btn g" data-a="pxref" style="margin:0">Segarkan harga</button><button class="btn g" data-a="pxman" data-as="${a}" style="margin:0">Isi harga manual</button></div>`}
function hubHtml(a){const H=S.hold.filter(x=>x.space==='personal'&&x.asset===a),u=AS[a].u;
 return `<h2>${AS[a].n}</h2><div class="card">${box(a)}</div>${S.holdErr?`<div class="msg">Tabel tabungan belum siap di Supabase: ${esc(S.holdErr)}</div>`:''}<button class="btn" data-a="hadd">+ Catat beli/jual ${AS[a].n}</button>${H.length?`<div class="card">${opts(H.slice(0,10),x=>`<div class="row"><div><b>${x.side==='buy'?'Beli':'Jual'} ${fmtQ(toSc(x.quantity,a),a)} ${u}</b><div class="sub">${new Date(x.occurred_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})} · @ ${rp(Number(x.price_idr))}${Number(x.fee_idr)?' · biaya '+rp(Number(x.fee_idr)):''}</div></div><button class="del" data-hdel="${x.id}">Hapus</button></div>`)}</div>`:''}<button class="btn g" data-a="close">Tutup</button>`}
function openHub(a){S.ha=a;openS(hubHtml(a));S.hub=a}
const updPrice=()=>{if(S.user){const y=scrollY;render();scrollTo(0,y)}};
const tf=u=>{const c=new AbortController();setTimeout(()=>c.abort(),8000);return fetch(u,{signal:c.signal})};
const savePx=()=>{try{localStorage.setItem('mf_px',JSON.stringify(S.px))}catch(e){}};
async function fetchPx(){if(!navigator.onLine){S.pxE.btc=S.pxE.gold='offline';return updPrice()}
 let b=0,g=0;
 try{const j=await(await tf('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,pax-gold,tether-gold&vs_currencies=idr')).json();
  b=Math.round((j.bitcoin||{}).idr||0);const o=((j['pax-gold']||{}).idr||(j['tether-gold']||{}).idr||0);g=Math.round(o/31.1034768)}catch(e){}
 if(!(b>0)){try{const j=await(await tf('https://indodax.com/api/ticker/btcidr')).json();const p=Math.round(Number(j.ticker.last));if(p>0){b=p;S.px.btc={p,t:Date.now(),src:'Indodax'};S.pxE.btc=''}}catch(e){}}
 else{S.px.btc={p:b,t:Date.now(),src:'CoinGecko'};S.pxE.btc=''}
 if(g>0){S.px.gold={p:g,t:Date.now(),src:'estimasi emas dunia'};S.pxE.gold=''}
 if(!(S.px.btc.t>Date.now()-5000))S.pxE.btc='gagal memuat harga';
 if(!(g>0))S.pxE.gold='gagal memuat harga';
 savePx();updPrice()}
const dueTxt=(r,due)=>{if(!(r>0&&due))return '';const dd=Math.ceil((new Date(due+'T00:00')-new Date().setHours(0,0,0,0))/864e5);return `<div class="sub ${dd<=3?'out':''}">${dd<0?'Lewat '+(-dd)+' hari':dd===0?'Jatuh tempo hari ini':dd+' hari lagi'} (${esc(due)})</div>`};
function debtGroups(D){const m=new Map();[...D].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(d=>{const k=d.kind+'|'+d.party.trim().toLowerCase();if(!m.has(k))m.set(k,[]);m.get(k).push(d)});return [...m.values()]}
const groupKey=G=>G[0].kind+'|'+G[0].party.trim().toLowerCase();
const gStat=G=>{const tot=G.reduce((s,d)=>s+d.amount,0),pd=G.reduce((s,d)=>s+paidOf(d),0),r=tot-pd;return{tot,pd,r,st:r<=0?'Lunas':pd>0?'Sebagian lunas':'Belum lunas'}};
function groupSummary(G){const f=G[0],pay=f.kind==='payable',{r,st}=gStat(G);
 return `<button class="card" data-dg="${esc(groupKey(G))}" style="display:block;width:100%;text-align:left;border:0;color:var(--tx);font:inherit"><div class="row" style="border:0;padding:0"><div><b>${esc(f.party)}</b><div class="sub">${pay?'Utang saya':'Piutang'} · ${G.length} catatan</div></div><div style="text-align:right"><b class="${pay?'out':'in'}">${rp(r)}</b><div class="sub">${st} ›</div></div></div></button>`}
function groupDetail(G){const f=G[0],pay=f.kind==='payable',{tot,pd,r,st}=gStat(G);
 return `<h2 style="margin-top:0">${esc(f.party)}</h2><div class="card"><div class="row" style="border:0;padding:0"><div><span>${pay?'Utang saya':'Piutang'}</span><div class="sub">${st} · dibayar ${rp(pd)} dari ${rp(tot)}</div></div><b class="${pay?'out':'in'}">${rp(r)}</b></div>`+
 G.map((d,i)=>{const p1=paidOf(d),r1=d.amount-p1;return `<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><div class="row" style="border:0;padding:0"><span class="sub">Catatan ${i+1} · ${new Date(d.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})} · ${rp(d.amount)}</span><b class="${pay?'out':'in'}">${r1<=0?'Lunas':'Sisa '+rp(r1)}</b></div>${dueTxt(r1,d.due_date)}${d.note?`<div class="sub">${esc(d.note)}</div>`:''}${S.pays.filter(p=>p.debt_id===d.id).map(p=>`<div class="row"><span class="sub">${new Date(p.paid_at).toLocaleDateString('id-ID',{day:'numeric',month:'short'})} · ${rp(p.amount)}</span><button class="del" data-unpay="${p.transaction_id}">Batalkan</button></div>`).join('')}${r1>0?`<button class="btn g" data-pay="${d.id}" style="margin-top:8px">${pay?'Catat pembayaran':'Catat penerimaan'} (catatan ${i+1})</button>`:''}${p1===0?`<button class="del" data-deldebt="${d.id}">Hapus catatan ini</button>`:''}</div>`}).join('')+
 `</div><button class="btn" data-addto="${f.id}">+ Tambah catatan baru</button><div class="sub" style="margin-bottom:8px">Di formulir, nama dan jenis sudah terisi. Anda bisa menggantinya untuk orang lain.</div><button class="btn g" data-a="close">Tutup</button>`}
function openDG(k){const G=debtGroups(S.debts.filter(x=>x.space===S.space)).find(g=>groupKey(g)===k);if(!G)return;openS(groupDetail(G));S.dk=k}
function backDetail(){const k=S.ret;S.ret='';if(k)openDG(k)}

function render(){
 if(!S.user){$('app').innerHTML=`<h1>My Finance</h1><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Kata sandi (minimal 8 karakter)" autocomplete="current-password"><button class="btn" data-a="in">Masuk</button><button class="btn g" data-a="up">Daftar akun baru</button><div class="msg" id="msg">${esc(S.msg)}</div></div>`;return}

 const H=S.hold.filter(x=>x.space===S.space),A=S.acc.filter(a=>a.space===S.space),T=S.tx.filter(x=>x.space===S.space),D=S.debts.filter(x=>x.space===S.space),n=new Date(),
 inM=x=>{const d=new Date(x.occurred_at);return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()},
 sum=k=>T.filter(x=>x.kind===k&&inM(x)).reduce((s,x)=>s+x.amount,0),
 cash=A.reduce((s,a)=>s+Number(a.balance),0),i=sum('in'),o=sum('out'),
 rem=k=>D.filter(d=>d.kind===k).reduce((s,d)=>s+d.amount-paidOf(d),0),
 an=id=>esc((S.accAll.find(a=>a.id===id)||{}).name||'-'),
 cn=x=>esc((S.cat.find(c=>c.id===x.category_id)||{}).name||KL[x.kind]),
 isP=S.space==='personal',AV=a=>{const P=pos(H,a),pr=S.px[a].p;return isP?(pr?mulp(P.s,pr,a):P.c):0},bV=AV('btc'),gV=AV('gold'),total=cash+bV+gV,
 inc=['btc','gold'].filter(a=>isP&&H.some(x=>x.asset===a)).map(a=>AS[a].n+' '+rp(a==='btc'?bV:gV)).join(' · '),
 rowA=a=>{const P=pos(H,a),pr=S.px[a].p;return `<div class="row"><div><b>${AS[a].n}</b><div class="sub">Tabungan · ${fmtQ(P.s,a)} ${AS[a].u}${H.some(x=>x.asset===a)&&!pr?' · harga belum dimuat, nilai = modal':''}</div></div><div style="text-align:right"><b>${rp(AV(a))}</b><div><button class="del" data-a="hubopen" data-as="${a}" style="color:var(--acc)">Kelola</button></div></div></div>`},
 btcRow=isP?rowA('btc')+rowA('gold'):'';
 $('app').innerHTML=`${S.off?`<div class="card" style="background:var(--line)"><b>Mode offline</b><div class="sub">Menampilkan data terakhir yang tersimpan (${new Date(S.off).toLocaleString('id-ID')}). Menyimpan, mengubah, transfer, dan backup butuh internet.</div></div>`:''}<div class="seg">${Object.keys(SP).map(k=>`<button data-sp="${k}" class="${S.space===k?'on':''}">${SP[k]}</button>`).join('')}</div>
<div class="hero"><span>Total saldo</span><div class="big">${rp(total)}</div>${inc?`<div style="font-size:13px;opacity:.85">Termasuk ${inc}</div>`:''}<span>Arus kas bersih bulan ini: ${rp(i-o)}</span></div>
<div class="grid"><div class="card"><span class="sub">Pemasukan</span><div class="in"><b>${rp(i)}</b></div></div><div class="card"><span class="sub">Pengeluaran</span><div class="out"><b>${rp(o)}</b></div></div></div>
<button class="btn" data-a="addtx">+ Tambah transaksi</button><button class="btn g" data-a="xfer">Transfer</button><a class="btn g" href="./laporan.html">Grafik &amp; laporan</a>
<h2>Akun</h2><div class="card">${(opts(A,a=>`<div class="row"><div><b>${esc(a.name)}</b><div class="sub">${esc(a.type)}</div></div><div style="text-align:right"><b>${rp(Number(a.balance))}</b><div><button class="del" data-mng="${a.id}" style="color:var(--acc)">Kelola</button></div></div></div>`)+btcRow)||'<p class="sub">Belum ada akun. Tekan Tambah akun.</p>'}</div>
<button class="btn g" data-a="addacc">Tambah akun</button>
<h2>Utang dan piutang</h2><div class="grid"><div class="card"><span class="sub">Utang saya</span><div class="out"><b>${rp(rem('payable'))}</b></div></div><div class="card"><span class="sub">Piutang</span><div class="in"><b>${rp(rem('receivable'))}</b></div></div></div>
${opts(debtGroups(D),groupSummary)}<button class="btn g" data-a="adddebt">Tambah utang/piutang (orang baru)</button>
<h2>Transaksi terbaru</h2><div class="card">${opts(T.slice(0,20),x=>`<div class="row"><div><b>${cn(x)}</b><div class="sub">${new Date(x.occurred_at).toLocaleDateString('id-ID',{day:'numeric',month:'short'})} · ${an(x.account_id)}${x.note?' · '+esc(x.note):''}</div></div><div style="text-align:right"><b class="${x.kind==='in'?'in':x.kind==='out'?'out':''}">${PLUS.includes(x.kind)?'+':'-'}${rp(x.amount)}</b><div>${x.kind==='in'||x.kind==='out'?`<button class="del" data-edit="${x.id}" style="color:var(--acc);margin-right:10px">Ubah</button>`:''}<button class="del" data-del="${x.id}">Hapus</button></div></div></div>`)||'<p class="sub">Belum ada transaksi.</p>'}</div>
<button class="btn g" data-a="bk">Unduh backup (JSON)</button><a class="btn g" href="./pulihkan.html">Pulihkan dari backup</a><button class="btn g" data-a="out">Keluar</button><div class="msg">${esc(S.msg)}</div>`;if(S.hub)$('sf').innerHTML=hubHtml(S.hub);else if(S.dk){const G=debtGroups(S.debts.filter(x=>x.space===S.space)).find(g=>groupKey(g)===S.dk),bx=$('sf').parentElement,y=bx.scrollTop;if(G){$('sf').innerHTML=groupDetail(G);bx.scrollTop=y}else closeS()}}

async function auth(m){const email=$('em').value.trim(),password=$('pw').value;
 if(!email||password.length<8)return amsg('Isi email dan kata sandi (minimal 8 karakter).');
 const r=m==='up'?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return amsg(r.error.message);
 if(m==='up'&&!r.data.session)amsg('Cek email Anda, tekan tautan konfirmasi, lalu kembali ke sini dan masuk.')}

function openTx(id){const A=S.acc.filter(a=>a.space===S.space);if(!A.length){S.msg='Tambahkan akun dulu sebelum mencatat transaksi.';return render()}
 const x=id?S.tx.find(t=>t.id===id):null;S.eid=x?x.id:null;S.req=crypto.randomUUID();
 openS(`<h2>${x?'Ubah transaksi':'Transaksi baru'}</h2><select id="kind"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select><input id="amt" inputmode="numeric" placeholder="Nominal (Rp)" autocomplete="off"><select id="cat"></select><select id="acs">${opts(A,a=>`<option value="${a.id}">${esc(a.name)}</option>`)}</select><input id="note" placeholder="Catatan (opsional)"><div class="msg" id="fm"></div><button class="btn" id="sv" data-a="savetx">${x?'Simpan perubahan':'Simpan transaksi'}</button><button class="btn g" data-a="close">Batal</button>`);
 if(x){$('kind').value=x.kind;fillCat();$('amt').value=x.amount;$('cat').value=x.category_id||'';$('acs').value=x.account_id;$('note').value=x.note||''}else fillCat()}
function fillCat(){$('cat').innerHTML=opts(S.cat.filter(c=>c.space===S.space&&c.kind===$('kind').value),c=>`<option value="${c.id}">${esc(c.name)}</option>`)}
async function saveTx(){if(S.busy)return;const amount=num($('amt').value);if(!amount)return fm('Isi nominal lebih dari nol.');
 S.busy=true;$('sv').disabled=true;
 const f={account_id:$('acs').value,kind:$('kind').value,amount,category_id:$('cat').value||null,note:$('note').value.trim()||null},
 r=S.eid?await sb.from('transactions').update(f).eq('id',S.eid):await sb.from('transactions').insert({...f,space:S.space,request_id:S.req});
 S.busy=false;if($('sv'))$('sv').disabled=false;
 if(r.error&&r.error.code!=='23505')return fm('Gagal menyimpan: '+r.error.message+'. Coba lagi.');
 closeS();await load()}

function openAcc(){openS(`<h2>Akun baru</h2><input id="an" placeholder="Nama akun, mis. BCA"><select id="at"><option>Tunai</option><option>Bank</option><option>E-wallet</option><option>Lainnya</option></select><input id="ao" inputmode="numeric" placeholder="Saldo awal (Rp)" autocomplete="off"><div class="msg" id="fm"></div><button class="btn" id="sv" data-a="saveacc">Simpan akun</button><button class="btn g" data-a="close">Batal</button>`)}
async function saveAcc(){if(S.busy)return;const name=$('an').value.trim();if(!name)return fm('Isi nama akun.');
 S.busy=true;$('sv').disabled=true;
 const r=await sb.from('accounts').insert({space:S.space,name,type:$('at').value,opening_balance:num($('ao').value)});
 S.busy=false;if($('sv'))$('sv').disabled=false;
 if(r.error)return fm('Gagal menyimpan: '+r.error.message);closeS();await load()}

function openXf(){const A=S.acc.filter(a=>a.space===S.space);if(!A.length){S.msg='Tambahkan akun dulu.';return render()}
 S.req=crypto.randomUUID();
 openS(`<h2>Transfer</h2><select id="xf">${opts(A,a=>`<option value="${a.id}">Dari: ${esc(a.name)} (${rp(Number(a.balance))})</option>`)}</select><select id="xt"><option value="">Ke akun...</option>${opts(S.acc,a=>`<option value="${a.id}">${esc(a.name)} (${SP[a.space]})</option>`)}</select><input id="xa" inputmode="numeric" placeholder="Nominal (Rp)" autocomplete="off"><input id="xe" inputmode="numeric" placeholder="Biaya administrasi (opsional)"><input id="xn" placeholder="Catatan (opsional)"><div class="msg" id="fm"></div><button class="btn" id="sv" data-a="savexf">Simpan transfer</button><button class="btn g" data-a="close">Batal</button>`)}
async function saveXf(){if(S.busy)return;const amt=num($('xa').value);if(!$('xt').value)return fm('Pilih akun tujuan.');if(!amt)return fm('Isi nominal.');
 S.busy=true;$('sv').disabled=true;
 const r=await sb.rpc('create_transfer',{p_from:$('xf').value,p_to:$('xt').value,p_amount:amt,p_fee:num($('xe').value),p_note:$('xn').value.trim()||null,p_request:S.req});
 S.busy=false;if($('sv'))$('sv').disabled=false;
 if(r.error)return fm(r.error.message);closeS();await load()}

function openDebt(pre){openS(`<h2>Utang/piutang baru</h2><select id="dk"><option value="payable">Utang saya</option><option value="receivable">Piutang (orang lain berutang ke saya)</option></select><input id="dp" placeholder="Nama pihak terkait"><input id="da" inputmode="numeric" placeholder="Nominal awal (Rp)" autocomplete="off"><div class="sub">Jatuh tempo (opsional)</div><input id="dd" type="date"><input id="dn" placeholder="Catatan (opsional)"><div class="msg" id="fm"></div><button class="btn" id="sv" data-a="savedebt">Simpan</button><button class="btn g" data-a="close">Batal</button>`);if(pre){$('dk').value=pre.kind;$('dp').value=pre.party}}
async function saveDebt(){if(S.busy)return;const party=$('dp').value.trim(),amount=num($('da').value);if(!party)return fm('Isi nama pihak terkait.');if(!amount)return fm('Isi nominal.');
 S.busy=true;$('sv').disabled=true;
 const r=await sb.from('debts').insert({space:S.space,kind:$('dk').value,party,amount,due_date:$('dd').value||null,note:$('dn').value.trim()||null});
 S.busy=false;if($('sv'))$('sv').disabled=false;
 if(r.error)return fm('Gagal menyimpan: '+r.error.message);closeS();await load();backDetail()}
function openPay(id){const d=S.debts.find(x=>x.id===id),A=S.acc.filter(a=>a.space===d.space);if(!A.length){S.msg='Tambahkan akun dulu.';return render()}
 S.req=crypto.randomUUID();S.pid=id;
 openS(`<h2>${d.kind==='payable'?'Bayar utang':'Terima pelunasan'}: ${esc(d.party)}</h2><div class="sub" style="margin-bottom:8px">Sisa ${rp(d.amount-paidOf(d))}</div><input id="pa" inputmode="numeric" placeholder="Nominal (Rp)" autocomplete="off"><select id="pc">${opts(A,a=>`<option value="${a.id}">${esc(a.name)} (${rp(Number(a.balance))})</option>`)}</select><div class="msg" id="fm"></div><button class="btn" id="sv" data-a="savepay">Simpan pembayaran</button><button class="btn g" data-a="close">Batal</button>`)}
async function savePay(){if(S.busy)return;const amt=num($('pa').value),d=S.debts.find(x=>x.id===S.pid),ac=S.acc.find(a=>a.id===$('pc').value);if(!amt)return fm('Isi nominal.');
 if(d.kind==='payable'&&amt>Number(ac.balance))return fm('Saldo akun tidak cukup.');
 S.busy=true;$('sv').disabled=true;
 const r=await sb.rpc('pay_debt',{p_debt:S.pid,p_account:$('pc').value,p_amount:amt,p_request:S.req});
 S.busy=false;if($('sv'))$('sv').disabled=false;
 if(r.error)return fm(r.error.message);closeS();await load();backDetail()}
function openMng(id){const a=S.acc.find(x=>x.id===id);if(!a)return;S.mid=id;
 openS(`<h2>Kelola akun</h2><input id="mn" value="${esc(a.name)}" placeholder="Nama akun"><select id="mt">${['Tunai','Bank','E-wallet','Lainnya'].map(t=>`<option${t===a.type?' selected':''}>${t}</option>`).join('')}</select><div class="sub" style="margin-bottom:8px">Saldo sekarang: ${rp(Number(a.balance))}</div><div class="msg" id="fm"></div><button class="btn" id="sv" data-a="mngsave">Simpan perubahan</button><button class="btn g" data-a="mngoff">Nonaktifkan (sembunyikan, riwayat tetap)</button><button class="btn g" data-a="mngdel" style="color:var(--out)">Hapus permanen</button><button class="btn g" data-a="close">Batal</button><div class="sub">Nonaktifkan hanya bisa jika saldo akun Rp0. Hapus permanen hanya bisa jika akun belum punya transaksi, utang, atau pembayaran.</div>`)}
async function mngSave(){if(S.busy)return;const name=$('mn').value.trim();if(!name)return fm('Isi nama akun.');
 S.busy=true;const r=await sb.from('accounts').update({name,type:$('mt').value}).eq('id',S.mid);S.busy=false;
 if(r.error)return fm('Gagal menyimpan: '+r.error.message);closeS();await load()}
async function mngOff(){if(S.busy)return;const a=S.acc.find(x=>x.id===S.mid);
 if(Number(a.balance)!==0)return fm('Saldo harus Rp0 dulu. Pindahkan saldo lewat Transfer.');
 if(!confirm('Nonaktifkan akun '+a.name+'? Akun disembunyikan, riwayat tetap ada.'))return;
 S.busy=true;const r=await sb.from('accounts').update({is_active:false}).eq('id',S.mid);S.busy=false;
 if(r.error)return fm('Gagal: '+r.error.message);closeS();await load()}
async function mngDel(){if(S.busy)return;const a=S.acc.find(x=>x.id===S.mid);
 if(!confirm('Hapus permanen akun '+a.name+'? Tidak bisa dibatalkan.'))return;
 S.busy=true;const r=await sb.from('accounts').delete().eq('id',S.mid);S.busy=false;
 if(r.error)return fm('Tidak bisa dihapus karena akun ini sudah punya riwayat. Gunakan Nonaktifkan. ('+r.error.message+')');closeS();await load()}
function openH(){const a=S.ha,m=AS[a];S.req=crypto.randomUUID();
 openS(`<h2>Catat ${m.n}</h2><select id="bs"><option value="buy">Beli</option><option value="sell">Jual</option></select><input id="bq" inputmode="decimal" placeholder="Jumlah ${m.u}, mis. ${a==='btc'?'0,005':'2,5'}" autocomplete="off"><input id="bp" inputmode="numeric" placeholder="Harga per 1 ${m.u} (Rp)" value="${S.px[a].p||''}" autocomplete="off"><input id="bf" inputmode="numeric" placeholder="Biaya/fee (Rp, opsional)" autocomplete="off"><div class="sub">Tanggal</div><input id="bd" type="date" value="${new Date().toLocaleDateString('sv-SE')}"><input id="bn" placeholder="Catatan (opsional)"><div class="msg" id="fm"></div><button class="btn" id="sv" data-a="hsave">Simpan</button><button class="btn g" data-a="close">Batal</button>`)}
async function saveH(){if(S.busy)return;const a=S.ha,m=AS[a];if(S.space!=='personal')return fm('Tabungan hanya untuk ruang Personal.');const q=parseFloat(String($('bq').value).replace(',','.')),sc=Math.round(q*m.sc),price=num($('bp').value),side=$('bs').value;
 if(!(sc>=1))return fm('Isi jumlah '+m.u+' lebih dari nol (maksimal '+m.dp+' angka di belakang koma).');if(!price)return fm('Isi harga per 1 '+m.u+'.');
 if(side==='sell'&&sc>pos(S.hold.filter(x=>x.space===S.space),a).s)return fm('Jumlah jual melebihi kepemilikan.');
 const ds=$('bd').value||new Date().toLocaleDateString('sv-SE'),at=ds===new Date().toLocaleDateString('sv-SE')?new Date().toISOString():new Date(ds+'T12:00:00').toISOString();
 S.busy=true;$('sv').disabled=true;
 const r=await sb.from('holdings_entries').insert({space:S.space,asset:a,side,quantity:(sc/m.sc).toFixed(8),price_idr:price,fee_idr:num($('bf').value),occurred_at:at,note:$('bn').value.trim()||null,request_id:S.req});
 S.busy=false;if($('sv'))$('sv').disabled=false;
 if(r.error&&r.error.code!=='23505')return fm('Gagal menyimpan: '+r.error.message);closeS();await load();openHub(a)}
async function delHold(id){if(!confirm('Hapus catatan ini?'))return;const r=await sb.from('holdings_entries').delete().eq('id',id);if(r.error)S.msg='Gagal menghapus: '+r.error.message;await load()}
async function delDebt(id){if(!confirm('Hapus catatan ini?'))return;const r=await sb.from('debts').delete().eq('id',id);if(r.error)S.msg='Gagal menghapus: '+r.error.message;await load()}

async function delTx(id){const x=S.tx.find(t=>t.id===id);if(!x)return;
 if(!confirm(x.transfer_group?'Hapus transfer ini? Kedua sisi pencatatan akan dihapus.':x.debt_id?'Hapus pembayaran ini? Sisa utang/piutang akan bertambah lagi.':'Hapus transaksi ini?'))return;
 const q=sb.from('transactions').delete(),r=await(x.transfer_group?q.eq('transfer_group',x.transfer_group):q.eq('id',id));
 if(r.error)S.msg='Gagal menghapus: '+r.error.message;await load()}

async function backup(){const o={app:'My Finance',version:1,exported_at:new Date().toISOString()};
 try{for(const n of ['accounts','categories','debts','transactions','debt_payments','audit_log','holdings_entries']){try{o[n]=await pageAll(n)}catch(x){if(n==='holdings_entries')o[n]=[];else throw x}}}catch(e){S.msg='Backup gagal: '+e.message;return render()}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));
 a.download='my-finance-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(S.off&&(d.addto||d.hdel||['hadd','hsave'].includes(a)||d.mng||d.edit||d.del||d.pay||d.unpay||d.deldebt||['addtx','xfer','addacc','adddebt','bk'].includes(a))){S.msg='Sedang offline. Hubungkan internet dulu untuk menyimpan atau mengubah data.';return render()}
 if(d.pay||d.addto||a==='adddebt')S.ret=S.dk;
 if(d.sp){S.space=d.sp;render()}
 else if(d.dg)openDG(d.dg)
 else if(d.addto){const x=S.debts.find(z=>z.id===d.addto);if(x)openDebt({kind:x.kind,party:x.party})}
 else if(d.hdel)delHold(d.hdel)
 else if(a==='hubopen')openHub(d.as);else if(a==='hadd')openH();else if(a==='hsave')saveH();else if(a==='pxref')fetchPx();
 else if(a==='pxman'){const k=d.as,v=num(prompt('Masukkan harga 1 '+AS[k].u+' dalam Rupiah')||'');if(v>0){S.px[k]={p:v,t:Date.now(),src:'manual'};S.pxE[k]='';savePx();updPrice()}}
 else if(d.mng)openMng(d.mng)
 else if(d.edit)openTx(d.edit)
 else if(d.del)delTx(d.del)
 else if(d.pay)openPay(d.pay)
 else if(d.unpay){if(confirm('Batalkan pembayaran ini? Saldo akun akan dikembalikan.')){const r=await sb.from('transactions').delete().eq('id',d.unpay);if(r.error)S.msg='Gagal membatalkan: '+r.error.message;await load()}}
 else if(d.deldebt)delDebt(d.deldebt)
 else if(a==='in'||a==='up')auth(a)
 else if(a==='addtx')openTx();else if(a==='xfer')openXf();else if(a==='addacc')openAcc();else if(a==='adddebt')openDebt()
 else if(a==='savetx')saveTx();else if(a==='savexf')saveXf();else if(a==='saveacc')saveAcc();else if(a==='savedebt')saveDebt();else if(a==='savepay')savePay()
 else if(a==='mngsave')mngSave();else if(a==='mngoff')mngOff();else if(a==='mngdel')mngDel();
 else if(a==='close'){closeS();backDetail()}else if(a==='bk')backup();else if(a==='out'){try{localStorage.removeItem(CK)}catch(x){}await sb.auth.signOut()}});
document.addEventListener('change',e=>{if(e.target.id==='kind')fillCat()});

async function start(){if(!navigator.onLine)return load();const r=await sb.rpc('seed_default_categories');if(r.error)S.msg='Kategori bawaan gagal dibuat: '+r.error.message;await load()}
if(!OK)$('app').innerHTML='<h1>My Finance</h1><div class="card">Isi dulu file config.js dengan Project URL dan kunci publishable.</div>';
else sb.auth.onAuthStateChange((ev,ses)=>{
 if(!ses&&!navigator.onLine){const ch=readCache();if(ch){S.user={id:ch.uid};S.real=false;useCache(ch);return render()}}
 if(!ses){try{localStorage.removeItem(CK)}catch(x){}}
 S.user=ses?.user||null;S.real=!!ses;if(!S.user){S.acc=[];S.accAll=[];S.cat=[];S.tx=[];S.debts=[];S.pays=[];S.msg=''}setTimeout(()=>S.user?start():render(),0)});
setInterval(()=>{if(S.user&&!document.hidden)fetchPx()},60000);
addEventListener('online',()=>{fetchPx();if(S.user){S.real?load():location.reload()}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
